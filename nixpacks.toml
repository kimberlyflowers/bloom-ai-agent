[phases.setup]
nixPkgs = ["python313", "pipenv"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt",
  "mkdir -p /data/playwright-browsers",
  "export PLAYWRIGHT_BROWSERS_PATH=/data/playwright-browsers && playwright install --with-deps chromium"
]

[start]
cmd = "python main.py"
