<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOOM Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse-slow { animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-up { animation: slideUp 0.5s ease-out; }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function CommandCenter() {
            const [view, setView] = useState('agents'); // 'agents' or 'approvals'
            const [agents, setAgents] = useState({});
            const [pending, setPending] = useState([]);
            const [connected, setConnected] = useState(false);
            const [liveUpdate, setLiveUpdate] = useState(null);
            const wsRef = useRef(null);

            // Connect to command center WebSocket
            useEffect(() => {
                // Determine WebSocket URL (Railway or localhost)
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsHost = window.location.host;
                const wsUrl = `${wsProtocol}//${wsHost}/command`;

                console.log('Connecting to command center:', wsUrl);

                const ws = new WebSocket(wsUrl);
                wsRef.current = ws;

                ws.onopen = () => {
                    console.log('✅ Connected to command center');
                    setConnected(true);
                    setLiveUpdate('Connected to command center');
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('📥 Command center message:', data.type);

                        if (data.type === 'initial_data') {
                            setAgents(data.agents || {});
                            setPending(data.pending_approvals || []);
                            setLiveUpdate('Received initial data');
                        } else if (data.type === 'agent_update') {
                            setAgents(data.agents || {});
                            setLiveUpdate('Agent data updated');
                        } else if (data.type === 'pending_update') {
                            setPending(data.pending_approvals || []);
                            setLiveUpdate('Approval queue updated');
                        } else if (data.type === 'new_content') {
                            setPending(prev => [...prev, data.content]);
                            setLiveUpdate(`New content: ${data.content.title}`);
                        } else if (data.type === 'approval_action') {
                            setPending(prev => prev.filter(c => c.content_id !== data.content_id));
                            setLiveUpdate(`Content ${data.action}: ${data.content_id}`);
                        }
                    } catch (e) {
                        console.error('Error parsing message:', e);
                    }
                };

                ws.onclose = () => {
                    console.log('🔌 Disconnected from command center');
                    setConnected(false);
                    setLiveUpdate('Disconnected from command center');
                };

                ws.onerror = (error) => {
                    console.error('❌ WebSocket error:', error);
                    setLiveUpdate('Connection error');
                };

                return () => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.close();
                    }
                };
            }, []);

            const sendCommand = (command) => {
                if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                    wsRef.current.send(JSON.stringify(command));
                    console.log('📤 Sent command:', command.type);
                }
            };

            const approveContent = (contentId) => {
                sendCommand({
                    type: 'approve_content',
                    content_id: contentId,
                    feedback: 'Looks great!'
                });
            };

            const rejectContent = (contentId) => {
                const feedback = prompt('Feedback for agent:');
                if (feedback) {
                    sendCommand({
                        type: 'reject_content',
                        content_id: contentId,
                        feedback: feedback
                    });
                }
            };

            const openAgentScreen = (agentId) => {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsHost = window.location.host;
                window.open(`/screen.html?agent=${agentId}`, '_blank');
            };

            const agentCount = Object.keys(agents).length;
            const activeCount = Object.values(agents).filter(a => a.status === 'active').length;
            const pendingCount = pending.length;

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-7xl mx-auto">
                            <h1 className="text-4xl font-bold mb-2">🎛️  BLOOM Command Center</h1>
                            <p className="text-purple-200">Multi-Agent Dashboard</p>
                            <div className="mt-2 flex items-center space-x-4">
                                <span className={`flex items-center ${connected ? 'text-green-200' : 'text-red-200'}`}>
                                    <span className={`mr-2 ${connected ? 'pulse-slow' : ''}`}>●</span>
                                    {connected ? 'Connected' : 'Disconnected'}
                                </span>
                                <span className="text-purple-200">|</span>
                                <span>{agentCount} agents</span>
                                <span className="text-purple-200">|</span>
                                <span>{pendingCount} pending approvals</span>
                            </div>
                        </div>
                    </div>

                    {/* Live Updates Bar */}
                    {liveUpdate && (
                        <div className="bg-green-500 text-white px-6 py-2 shadow slide-up">
                            <div className="max-w-7xl mx-auto flex items-center">
                                <span className="pulse-slow mr-2">●</span>
                                <span className="font-medium">LIVE:</span>
                                <span className="ml-2">{liveUpdate}</span>
                            </div>
                        </div>
                    )}

                    {/* Navigation */}
                    <div className="max-w-7xl mx-auto px-6 py-4">
                        <div className="flex space-x-4">
                            <button
                                onClick={() => setView('agents')}
                                className={`px-6 py-2 rounded-lg font-medium transition ${
                                    view === 'agents'
                                        ? 'bg-purple-600 text-white'
                                        : 'bg-white text-gray-700 hover:bg-gray-100'
                                }`}
                            >
                                🤖 Agents ({agentCount})
                            </button>
                            <button
                                onClick={() => setView('approvals')}
                                className={`px-6 py-2 rounded-lg font-medium transition ${
                                    view === 'approvals'
                                        ? 'bg-purple-600 text-white'
                                        : 'bg-white text-gray-700 hover:bg-gray-100'
                                }`}
                            >
                                ✅ Approvals ({pendingCount})
                            </button>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-6 pb-6">
                        {/* Agents View */}
                        {view === 'agents' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {Object.values(agents).map(agent => (
                                    <div key={agent.agent_id} className="bg-white rounded-lg shadow-md p-6 card-hover">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="font-bold text-lg">{agent.name}</h3>
                                                <span className={`inline-block px-2 py-1 text-xs font-semibold rounded mt-1 ${
                                                    agent.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'
                                                }`}>
                                                    {agent.status.toUpperCase()}
                                                </span>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-2xl font-bold text-purple-600">{agent.trust_score}</div>
                                                <div className="text-xs text-gray-500">Trust</div>
                                            </div>
                                        </div>

                                        <div className="space-y-2 text-sm mb-4">
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Current task:</span>
                                                <span className="font-semibold">{agent.current_task}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Pending:</span>
                                                <span className="font-semibold">{agent.pending_approvals}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Friend Test:</span>
                                                <span className="font-semibold">{agent.friend_test_pass_rate}%</span>
                                            </div>
                                        </div>

                                        <button
                                            onClick={() => openAgentScreen(agent.agent_id)}
                                            className="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition"
                                        >
                                            🎥 View Screen
                                        </button>
                                    </div>
                                ))}

                                {agentCount === 0 && (
                                    <div className="col-span-3 text-center py-12 text-gray-500">
                                        No agents registered yet
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Approvals View */}
                        {view === 'approvals' && (
                            <div className="space-y-4">
                                {pending.map(content => (
                                    <div key={content.content_id} className="bg-white rounded-lg shadow-md p-6 card-hover">
                                        <div className="flex justify-between items-start mb-4">
                                            <div className="flex-1">
                                                <h3 className="font-bold text-lg mb-1">{content.title || 'Untitled'}</h3>
                                                <p className="text-sm text-gray-600">
                                                    Agent: {agents[content.agent_id]?.name || content.agent_id}
                                                </p>
                                                <p className="text-xs text-gray-500 mt-1">
                                                    Platform: {content.platform} | Type: {content.content_type}
                                                </p>
                                            </div>
                                            <span className="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm font-semibold">
                                                Pending
                                            </span>
                                        </div>

                                        {/* Video Preview */}
                                        {content.video_path && (
                                            <div className="mb-4">
                                                <video
                                                    src={`/videos/${content.video_path.split('/').pop()}`}
                                                    controls
                                                    className="w-full max-w-md rounded-lg"
                                                >
                                                    Your browser does not support video playback.
                                                </video>
                                            </div>
                                        )}

                                        {/* Script */}
                                        {content.script && (
                                            <div className="mb-4 p-4 bg-gray-50 rounded-lg">
                                                <div className="text-sm font-semibold text-gray-700 mb-2">Script:</div>
                                                <div className="text-sm text-gray-600 whitespace-pre-wrap">{content.script}</div>
                                            </div>
                                        )}

                                        {/* Caption */}
                                        {content.caption && (
                                            <div className="mb-4 p-4 bg-gray-50 rounded-lg">
                                                <div className="text-sm font-semibold text-gray-700 mb-2">Caption:</div>
                                                <div className="text-sm text-gray-600">{content.caption}</div>
                                            </div>
                                        )}

                                        {/* Actions */}
                                        <div className="flex space-x-4">
                                            <button
                                                onClick={() => approveContent(content.content_id)}
                                                className="flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition font-medium"
                                            >
                                                ✅ Approve
                                            </button>
                                            <button
                                                onClick={() => rejectContent(content.content_id)}
                                                className="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition font-medium"
                                            >
                                                ❌ Reject
                                            </button>
                                        </div>
                                    </div>
                                ))}

                                {pendingCount === 0 && (
                                    <div className="text-center py-12 text-gray-500">
                                        <div className="text-4xl mb-2">✨</div>
                                        <div className="text-lg font-medium">No pending approvals</div>
                                        <div className="text-sm">All caught up!</div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Footer */}
                    <div className="bg-gray-800 text-gray-300 p-6 mt-12">
                        <div className="max-w-7xl mx-auto text-center">
                            <p className="text-sm">BLOOM Command Center • Real-Time Multi-Agent Management</p>
                            <p className="text-xs text-gray-500 mt-2">NO FASTAPI • Pure WebSocket • Production Ready</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CommandCenter />, document.getElementById('root'));
    </script>
</body>
</html>
