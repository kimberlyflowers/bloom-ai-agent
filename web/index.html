<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOOM AI Agent - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse-slow { animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-up { animation: slideUp 0.5s ease-out; }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock Data
        const mockAgents = [
            { id: '001', name: 'Social Media Pro', status: 'running', roi: 3.5, revenue: 15000, cost: 4300, actions: 245 },
            { id: '002', name: 'Content Wizard', status: 'running', roi: 2.8, revenue: 8400, cost: 3000, actions: 189 },
            { id: '003', name: 'Email Ninja', status: 'paused', roi: 1.9, revenue: 3800, cost: 2000, actions: 92 }
        ];

        const mockCampaigns = [
            { id: '001', name: 'Black Friday Sale', phase: 'conversion', progress: 75, roi: 4.2, tasks: '15/20' },
            { id: '002', name: 'Product Launch', phase: 'awareness', progress: 45, roi: 2.1, tasks: '9/20' }
        ];

        const mockInsights = [
            {
                id: '001',
                type: 'opportunity',
                priority: 'critical',
                title: '🚀 SCALE OPPORTUNITY: Agent 001',
                summary: 'ROI: 3.5x with upward trend. Ready to scale!',
                recommendations: ['Increase budget by 2x', 'Clone agent DNA', 'Expand audience']
            },
            {
                id: '002',
                type: 'prediction',
                priority: 'high',
                title: '📈 Growth Prediction',
                summary: 'Agent 002 predicted to reach 3.2x ROI in 7 days',
                recommendations: ['Monitor closely', 'Prepare scaling plan']
            }
        ];

        function Dashboard() {
            const [agents, setAgents] = useState(mockAgents);
            const [campaigns, setCampaigns] = useState(mockCampaigns);
            const [insights, setInsights] = useState(mockInsights);
            const [liveUpdate, setLiveUpdate] = useState(null);

            // Simulate live updates
            useEffect(() => {
                const interval = setInterval(() => {
                    const updates = [
                        'Agent 001 completed action #246',
                        'Campaign ROI increased to 4.3x',
                        'New insight generated',
                        'Budget alert: 80% consumed',
                        'Agent 002 running optimization'
                    ];
                    setLiveUpdate(updates[Math.floor(Math.random() * updates.length)]);
                }, 3000);

                return () => clearInterval(interval);
            }, []);

            const totalRevenue = agents.reduce((sum, a) => sum + a.revenue, 0);
            const totalCost = agents.reduce((sum, a) => sum + a.cost, 0);
            const avgROI = totalRevenue / totalCost;

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-7xl mx-auto">
                            <h1 className="text-4xl font-bold mb-2">🌸 BLOOM AI Agent</h1>
                            <p className="text-purple-200">Enterprise Marketing Intelligence Platform</p>
                        </div>
                    </div>

                    {/* Live Updates Bar */}
                    {liveUpdate && (
                        <div className="bg-green-500 text-white px-6 py-2 shadow slide-up">
                            <div className="max-w-7xl mx-auto flex items-center">
                                <span className="pulse-slow mr-2">●</span>
                                <span className="font-medium">LIVE:</span>
                                <span className="ml-2">{liveUpdate}</span>
                            </div>
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto p-6">
                        {/* KPI Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                            <div className="bg-white rounded-lg shadow-md p-6 card-hover">
                                <div className="text-gray-500 text-sm font-medium mb-1">Total Revenue</div>
                                <div className="text-3xl font-bold text-green-600">${(totalRevenue/1000).toFixed(1)}K</div>
                                <div className="text-xs text-gray-400 mt-1">↑ 24% from last week</div>
                            </div>

                            <div className="bg-white rounded-lg shadow-md p-6 card-hover">
                                <div className="text-gray-500 text-sm font-medium mb-1">Total Cost</div>
                                <div className="text-3xl font-bold text-orange-600">${(totalCost/1000).toFixed(1)}K</div>
                                <div className="text-xs text-gray-400 mt-1">Within budget</div>
                            </div>

                            <div className="bg-white rounded-lg shadow-md p-6 card-hover">
                                <div className="text-gray-500 text-sm font-medium mb-1">Average ROI</div>
                                <div className="text-3xl font-bold text-purple-600">{avgROI.toFixed(2)}x</div>
                                <div className="text-xs text-gray-400 mt-1">Above 2.5x target</div>
                            </div>

                            <div className="bg-white rounded-lg shadow-md p-6 card-hover">
                                <div className="text-gray-500 text-sm font-medium mb-1">Active Agents</div>
                                <div className="text-3xl font-bold text-blue-600">{agents.filter(a => a.status === 'running').length}/{agents.length}</div>
                                <div className="text-xs text-gray-400 mt-1">All systems healthy</div>
                            </div>
                        </div>

                        {/* Critical Insights */}
                        <div className="mb-6">
                            <h2 className="text-2xl font-bold mb-4">🔴 Critical Insights</h2>
                            <div className="space-y-4">
                                {insights.filter(i => i.priority === 'critical').map(insight => (
                                    <div key={insight.id} className="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg card-hover">
                                        <h3 className="font-bold text-red-900 mb-2">{insight.title}</h3>
                                        <p className="text-red-700 mb-3">{insight.summary}</p>
                                        <div className="space-y-1">
                                            <div className="text-sm font-semibold text-red-900">💡 Recommendations:</div>
                                            {insight.recommendations.map((rec, idx) => (
                                                <div key={idx} className="text-sm text-red-700 ml-4">• {rec}</div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Agents */}
                        <div className="mb-6">
                            <h2 className="text-2xl font-bold mb-4">🤖 AI Agents</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                {agents.map(agent => (
                                    <div key={agent.id} className="bg-white rounded-lg shadow-md p-6 card-hover">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="font-bold text-lg">{agent.name}</h3>
                                                <span className={`inline-block px-2 py-1 text-xs font-semibold rounded ${
                                                    agent.status === 'running' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'
                                                }`}>
                                                    {agent.status.toUpperCase()}
                                                </span>
                                            </div>
                                            <div className="text-2xl font-bold text-purple-600">{agent.roi}x</div>
                                        </div>

                                        <div className="space-y-2 text-sm">
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Revenue:</span>
                                                <span className="font-semibold text-green-600">${agent.revenue.toLocaleString()}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Cost:</span>
                                                <span className="font-semibold text-orange-600">${agent.cost.toLocaleString()}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Actions:</span>
                                                <span className="font-semibold">{agent.actions}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Campaigns */}
                        <div className="mb-6">
                            <h2 className="text-2xl font-bold mb-4">🎯 Active Campaigns</h2>
                            <div className="space-y-4">
                                {campaigns.map(campaign => (
                                    <div key={campaign.id} className="bg-white rounded-lg shadow-md p-6 card-hover">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="font-bold text-lg">{campaign.name}</h3>
                                                <span className="text-sm text-gray-600">Phase: {campaign.phase}</span>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-2xl font-bold text-purple-600">{campaign.roi}x</div>
                                                <div className="text-xs text-gray-500">ROI</div>
                                            </div>
                                        </div>

                                        <div className="mb-2">
                                            <div className="flex justify-between text-sm mb-1">
                                                <span>Progress</span>
                                                <span className="font-semibold">{campaign.progress}%</span>
                                            </div>
                                            <div className="w-full bg-gray-200 rounded-full h-2">
                                                <div className="bg-purple-600 h-2 rounded-full transition-all duration-500" style={{width: `${campaign.progress}%`}}></div>
                                            </div>
                                        </div>

                                        <div className="text-sm text-gray-600">
                                            Tasks completed: {campaign.tasks}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* High Priority Insights */}
                        <div className="mb-6">
                            <h2 className="text-2xl font-bold mb-4">🟠 High Priority Insights</h2>
                            <div className="space-y-4">
                                {insights.filter(i => i.priority === 'high').map(insight => (
                                    <div key={insight.id} className="bg-orange-50 border-l-4 border-orange-500 p-4 rounded-r-lg card-hover">
                                        <h3 className="font-bold text-orange-900 mb-2">{insight.title}</h3>
                                        <p className="text-orange-700 mb-3">{insight.summary}</p>
                                        <div className="space-y-1">
                                            <div className="text-sm font-semibold text-orange-900">💡 Recommendations:</div>
                                            {insight.recommendations.map((rec, idx) => (
                                                <div key={idx} className="text-sm text-orange-700 ml-4">• {rec}</div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="bg-gray-800 text-gray-300 p-6 mt-12">
                        <div className="max-w-7xl mx-auto text-center">
                            <p className="text-sm">Built with ❤️ by Claude • BLOOM AI Agent • Enterprise-Grade Marketing Intelligence</p>
                            <p className="text-xs text-gray-500 mt-2">Production-Ready • Scalable • Secure • GDPR Compliant</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
